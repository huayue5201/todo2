name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.os }}, nvim-${{ matrix.neovim }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 两个平台：路径分隔符 / 时区 / 剪贴板 / fs_realpath 都有平台分支，必须真机验证。
        # 版本只跑 nightly：插件依赖 vim.async（Neovim 0.13+），
        # 0.13 正式发布后把 stable 加进 neovim 列表即可，无需改动其它步骤。
        os: [ubuntu-latest, macos-latest]
        neovim: [nightly]
    steps:
      - uses: actions/checkout@v4

      - name: Install Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.neovim }}

      # 必需依赖：装到 pack 目录，测试脚本用 runtimepath 自动带上
      - name: Install nvim-store3
        run: |
          git clone --depth 1 https://github.com/huayue5201/nvim-store3 \
            "$HOME/.local/share/nvim/site/pack/deps/start/nvim-store3"

      - name: Run headless tests
        run: make test

      - name: Install luacheck (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y lua-check || luarocks install luacheck --local

      - name: Install luacheck (macOS)
        if: runner.os == 'macOS'
        run: brew install luacheck

      - name: Lint
        run: make lint

      - name: Generate helptags
        run: make docs && test -s doc/tags
